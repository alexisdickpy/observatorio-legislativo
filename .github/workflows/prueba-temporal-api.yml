# Temporal (#4): comprueba que la API responde desde los servidores de GitHub y que una
# sincronización incremental después de una completa no cambia nada. No confirma nada.
# Se elimina antes de integrar el PR.

name: Prueba temporal de la API desde GitHub

on:
  push:
    branches: [issue-4-sincronizacion]
    paths: [".github/workflows/prueba-temporal-api.yml"]

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: Consulta simple
        run: curl -sS -o /dev/null -w "HTTP %{http_code} en %{time_total} s\n" https://datosv2.congreso.gov.py/web/api/periodo
      - name: Importación completa
        run: python3 -m importador --modo completo
      - name: Importación incremental inmediata
        run: python3 -m importador --modo incremental
      - name: Diferencias con la copia del repositorio
        run: git status --short && git diff --stat
